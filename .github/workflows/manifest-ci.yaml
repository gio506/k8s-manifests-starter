name: Manifest CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Lint YAML files
        run: yamllint .

  schema-validate:
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes schemas
        run: kubeconform -summary -strict -skip Kustomization k8s/base/*.yaml

  kustomize-build:
    runs-on: ubuntu-latest
    needs: schema-validate
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Render manifests with kubectl kustomize
        run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - name: Show resource kinds
        run: kubectl kustomize k8s/overlays/dev | awk '/^kind:/{print $2}'

  security-manifest-check:
    runs-on: ubuntu-latest
    needs: kustomize-build
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened manifest defaults
        run: |
          grep -q "allowPrivilegeEscalation: false" k8s/base/deployment.yaml
          grep -q "runAsNonRoot: true" k8s/base/deployment.yaml
          grep -q "seccompProfile" k8s/base/deployment.yaml

  manifest-check:
    runs-on: ubuntu-latest
    needs: [yamllint, schema-validate, kustomize-build, security-manifest-check]
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Basic rendered-manifest checks (cluster independent)
        run: |
          kubectl kustomize k8s/overlays/dev > rendered.yaml

          for expected in \
            "kind: Namespace" \
            "kind: ConfigMap" \
            "kind: Deployment" \
            "kind: Service" \
            "kind: Ingress" \
            "kind: HorizontalPodAutoscaler" \
            "namespace: demo-web" \
            "replicas: 1" \
            "name: APP_STAGE" \
            "value: dev"
          do
            grep -q "$expected" rendered.yaml || {
              echo "Missing expected content in rendered output: $expected";
              exit 1;
            }
          done

  final-status-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - yamllint
      - schema-validate
      - kustomize-build
      - security-manifest-check
      - manifest-check
    steps:
      - name: Aggregate results
        shell: bash
        env:
          YAML: ${{ needs.yamllint.result }}
          SCHEMA: ${{ needs.schema-validate.result }}
          KUSTOMIZE: ${{ needs.kustomize-build.result }}
          SECURITY: ${{ needs.security-manifest-check.result }}
          MANIFEST: ${{ needs.manifest-check.result }}
        run: |
          for result in "$YAML" "$SCHEMA" "$KUSTOMIZE" "$SECURITY" "$MANIFEST"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
