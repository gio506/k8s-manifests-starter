name: Manifest CI

on:
  push:
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint YAML files
        run: yamllint .

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes schemas
        run: kubeconform -summary -strict -skip Kustomization k8s/base/*.yaml

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Render manifests with kubectl kustomize
        run: kubectl kustomize k8s/overlays/dev > /tmp/rendered.yaml
      - name: Show resource kinds
        run: kubectl kustomize k8s/overlays/dev | awk '/^kind:/{print $2}'

  manifest-check:
    runs-on: ubuntu-latest
    needs: [yamllint, schema-validate, kustomize-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Basic rendered-manifest checks (cluster independent)
        run: |
          kubectl kustomize k8s/overlays/dev > rendered.yaml

          # Ensure expected resource kinds exist in the rendered output.
          for kind in Namespace ConfigMap Deployment Service Ingress HorizontalPodAutoscaler; do
            grep -q "^kind: ${kind}$" rendered.yaml || {
              echo "Missing kind in rendered output: ${kind}";
              exit 1;
            }
          done

          # Ensure namespaced resources target demo-web namespace.
          test "$(grep -c '^  namespace: demo-web$' rendered.yaml)" -ge 5 || {
            echo "Expected namespaced resources to target demo-web";
            exit 1;
          }

          # Ensure the dev overlay changed replicas and APP_STAGE.
          grep -q '^  replicas: 1$' rendered.yaml || {
            echo "Expected dev overlay replica count to be 1";
            exit 1;
          }
          grep -q '^        value: dev$' rendered.yaml || {
            echo "Expected dev overlay APP_STAGE=dev";
            exit 1;
          }
