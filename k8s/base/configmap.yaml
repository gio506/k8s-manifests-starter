apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: demo-web
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>K8s Manifests Starter</title>
      </head>
      <body>
        <h1>Hello from Kubernetes manifests starter!</h1>
        <p>This page is served by nginx from a ConfigMap.</p>
      </body>
    </html>
